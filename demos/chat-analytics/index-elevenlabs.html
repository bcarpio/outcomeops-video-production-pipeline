<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OutcomeOps — Chat Demo (ElevenLabs voice picker)</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; font-family: Inter, system-ui, sans-serif; }
  #root { position: absolute; inset: 0; }
  .voice-picker { position: fixed; top: 12px; right: 12px; z-index: 10;
    display: flex; gap: 4px; align-items: center;
    padding: 4px 6px 4px 10px; border-radius: 999px;
    background: oklch(0.25 0.05 260); color: oklch(0.85 0.05 250);
    font: 500 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.05em; }
  .voice-picker a { color: oklch(0.75 0.1 250); text-decoration: none;
    padding: 4px 8px; border-radius: 999px; }
  .voice-picker a.active { background: oklch(0.55 0.17 265); color: white; }
  .voice-picker a:hover:not(.active) { color: white; }
  .voice-picker .label { color: oklch(0.7 0.05 250); padding-right: 4px; }
</style>
</head>
<body>
<div class="voice-picker" id="picker"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  // Build voice picker links in the chrome strip
  const VOICES = ['brielle', 'tesa', 'carolyn', 'summer', 'drew'];
  const params = new URLSearchParams(location.search);
  const current = VOICES.includes(params.get('voice')) ? params.get('voice') : 'brielle';
  window.__VOICE__ = current;
  const picker = document.getElementById('picker');
  picker.innerHTML = '<span class="label">voice:</span>' + VOICES.map(v =>
    `<a href="?voice=${v}" class="${v === current ? 'active' : ''}">${v}</a>`
  ).join('');
</script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="chat_ui.jsx"></script>
<script type="text/babel" src="scene.jsx"></script>

<script type="text/babel" data-presets="react">
  // Stage BEATS are Polly-calibrated (86.4s). ElevenLabs tracks are shorter
  // and have different prosody, so visuals drift from audio here — this page
  // is for voice-quality A/B only. Sync pass happens after picking a winner.
  const src = `narration-${window.__VOICE__}.mp3`;
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <Stage width={1440} height={900} duration={97} background="oklch(0.985 0.003 240)" persistKey={`ooo-chat-el-${window.__VOICE__}`}>
      <OutcomeOpsChatScene />
      <AudioTrack src={src} />
    </Stage>
  );
</script>
</body>
</html>
