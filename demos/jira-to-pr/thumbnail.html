<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thumbnail -- Jira to PR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050910; --ink: #f4f6fb; --ink-dim: #8a97ad; --ink-mute: #4d5a70;
    --cyan: #22d3ee; --amber: #fbbf24; --green: #34d399; --jira: #2684ff;
  }
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  .canvas { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 70% 60%, black 10%, transparent 75%);
    mask-image: radial-gradient(ellipse at 70% 60%, black 10%, transparent 75%); }
  .glow { position: absolute; right: -120px; top: 120px; width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(34,211,238,0.10), transparent 65%); }

  .wordmark { position: absolute; top: 46px; right: 76px; font-weight: 600; font-size: 24px;
    letter-spacing: -0.02em; color: var(--ink); }
  .wordmark .dot { color: var(--cyan); }

  .eyebrow { position: absolute; left: 90px; top: 88px;
    font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan); }
  .eyebrow .sep { color: var(--ink-mute); margin: 0 10px; }
  .eyebrow .lo { color: var(--ink-dim); }

  .text-block { position: absolute; left: 88px; top: 162px; width: 640px; }
  .line1 { font-weight: 500; font-size: 70px; letter-spacing: -0.035em; line-height: 1.0;
    color: var(--ink-dim); white-space: nowrap; }
  .line1 .strike { color: var(--ink-mute); text-decoration: line-through; text-decoration-thickness: 4px; text-decoration-color: var(--ink-mute); }
  .line2 { font-weight: 800; font-size: 132px; letter-spacing: -0.05em; line-height: 1.0;
    color: var(--amber); margin-top: 14px; white-space: nowrap; }
  .rule { width: 116px; height: 3px; background: var(--cyan); margin: 26px 0 22px; }
  .sub { font-weight: 400; font-size: 26px; letter-spacing: -0.015em; color: var(--ink-dim);
    max-width: 580px; line-height: 1.35; }
  .sub strong { color: var(--ink); font-weight: 500; }

  /* Stats card on the right */
  .card { position: absolute; right: 72px; top: 220px; width: 440px;
    background: #0c1320; border: 1px solid rgba(255,255,255,0.10); border-radius: 12px;
    box-shadow: 0 30px 80px -24px rgba(0,0,0,0.8); overflow: hidden; }
  .card .bar { display: flex; align-items: center; gap: 10px; padding: 13px 18px;
    background: #0a0e18; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ink-dim); }
  .card .bar .jdot { width: 18px; height: 18px; border-radius: 4px; background: var(--jira);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; }
  .card .bar .arrow { color: var(--cyan); margin: 0 4px; }
  .card .bar .gh { width: 18px; height: 18px; border-radius: 50%; background: #f0f6fc; }
  .card .stats { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 22px; }
  .stat { display: flex; justify-content: space-between; align-items: baseline; }
  .stat .k { color: var(--ink-dim); font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase; }
  .stat .v { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.cost .v { color: var(--green); }
  .stat.checks .v { color: var(--green); }
  .divider { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 0; }

  .tag { position: absolute; left: 90px; bottom: 52px;
    font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-mute); }
  .tag b { color: var(--ink-dim); font-weight: 600; }
</style>
</head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="wordmark">OutcomeOps<span class="dot">.ai</span></div>
  <div class="eyebrow">OUTCOMEOPS<span class="sep">·</span><span class="lo">JIRA TO PR · AUTONOMOUS</span></div>

  <div class="text-block">
    <div class="line1"><span class="strike">16 hours of work.</span></div>
    <div class="line2">12 minutes.</div>
    <div class="rule"></div>
    <div class="sub">One Jira label. ADR-grounded code. Six checks before a human looks at it.</div>
  </div>

  <div class="card">
    <div class="bar">
      <span class="jdot">J</span>CPE-42
      <span class="arrow">&rarr;</span>
      <span class="gh"></span>PR #47
    </div>
    <div class="stats">
      <div class="stat"><span class="k">Files</span><span class="v">8</span></div>
      <div class="stat"><span class="k">Lines added</span><span class="v">+342</span></div>
      <div class="divider"></div>
      <div class="stat cost"><span class="k">Cost</span><span class="v">$1.17</span></div>
      <div class="stat checks"><span class="k">PR checks</span><span class="v">6 / 6 PASS</span></div>
    </div>
  </div>

  <div class="tag"><b>DEMO</b> · TICKET TO MERGE-READY PR</div>
</div>
</body>
</html>
