<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thumbnail -- The Layer Underneath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050910; --ink: #f4f6fb; --ink-dim: #8a97ad; --ink-mute: #4d5a70;
    --cyan: #22d3ee; --amber: #fbbf24; --green: #34d399; --red: #f87171; --violet: #a78bfa;
  }
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  .canvas { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  .grid { position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse at 75% 50%, black 20%, transparent 78%);
    mask-image: radial-gradient(ellipse at 75% 50%, black 20%, transparent 78%); }
  .glow { position: absolute; right: -160px; top: 30px; width: 880px; height: 880px;
    background: radial-gradient(circle, rgba(34,211,238,0.14), transparent 65%); }

  .wordmark { position: absolute; top: 46px; right: 76px; font-weight: 600; font-size: 24px;
    letter-spacing: -0.02em; color: var(--ink); }
  .wordmark .dot { color: var(--cyan); }

  .eyebrow { position: absolute; left: 90px; top: 88px;
    font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan); }
  .eyebrow .sep { color: var(--ink-mute); margin: 0 10px; }
  .eyebrow .lo { color: var(--ink-dim); }

  .text-block { position: absolute; left: 88px; top: 178px; width: 600px; }
  .line1 { font-weight: 600; font-size: 78px; letter-spacing: -0.04em; line-height: 1.02; white-space: nowrap; }
  .line2 { font-weight: 800; font-size: 96px; letter-spacing: -0.045em; line-height: 1.0; margin-top: 4px; white-space: nowrap; }
  .line2 .accent { color: var(--cyan); }
  .rule { width: 116px; height: 3px; background: var(--cyan); margin: 32px 0 22px; }
  .sub { font-weight: 400; font-size: 26px; letter-spacing: -0.015em; color: var(--ink-dim);
    max-width: 540px; line-height: 1.35; }
  .sub strong { color: var(--ink); font-weight: 500; }

  /* Saturn ring on the right */
  .ring-stage { position: absolute; right: 0; top: 0; width: 600px; height: 720px; }
  .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .core {
    position: absolute; left: 50%; top: 50%;
    width: 200px; height: 200px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #C2EFFF 0%, var(--cyan) 25%, #1B7FA8 70%, #0D3F58 100%);
    box-shadow: 0 0 80px rgba(34,211,238,0.55), inset -16px -20px 40px rgba(0,0,0,0.45);
  }
  .core-halo {
    position: absolute; left: 50%; top: 50%;
    width: 480px; height: 480px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.28) 0%, transparent 60%);
  }

  .node {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    padding: 10px 6px; width: 88px; height: 78px;
    background: #0A1020;
    border-radius: 12px;
    border-width: 1.5px; border-style: solid;
    box-shadow: 0 8px 22px -8px currentColor;
  }
  .node .label { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; }
  .node svg { display: block; }
  .node.security    { color: var(--red);    border-color: var(--red); }
  .node.engineering { color: var(--cyan);   border-color: var(--cyan); }
  .node.architecture{ color: var(--violet); border-color: var(--violet); }
  .node.support     { color: var(--green);  border-color: var(--green); }
  .node.product     { color: var(--amber);  border-color: var(--amber); }

  .tag { position: absolute; left: 90px; bottom: 52px;
    font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-mute); }
  .tag b { color: var(--ink-dim); font-weight: 600; }
</style>
</head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="wordmark">OutcomeOps<span class="dot">.ai</span></div>
  <div class="eyebrow">ORG INTELLIGENCE<span class="sep">·</span><span class="lo">THE CAPSTONE</span></div>

  <div class="text-block">
    <div class="line1">The Layer</div>
    <div class="line2"><span class="accent">Underneath.</span></div>
    <div class="rule"></div>
    <div class="sub">Five departments. One substrate. <strong>The intelligence layer underneath every AI tool you ship.</strong></div>
  </div>

  <!-- Saturn ring stage on the right -->
  <div class="ring-stage">
    <div class="core-halo"></div>
    <div class="core"></div>

    <!-- Ring stroke (tilted ellipse) -->
    <svg class="ring-svg" viewBox="0 0 600 720">
      <defs>
        <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.85"/>
        </linearGradient>
      </defs>
      <ellipse cx="300" cy="360" rx="270" ry="120"
        stroke="url(#rg)" stroke-width="2.5" fill="none"/>
    </svg>

    <!-- Five department nodes positioned on the tilted ellipse.
         For a 25-deg tilt, ry = rx * cos(25) ≈ rx * 0.906.
         Using rx=270, ry≈245 — but for the thumbnail's flatter ring (visual
         interest) we use ry=120 (closer to top-down ellipse). -->
    <!-- Top (back) — Support, dimmer -->
    <div class="node support" style="left: 50%; top: 240px; opacity: 0.7; transform: translate(-50%, -50%) scale(0.88);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
      <div class="label">SUPPORT</div>
    </div>
    <!-- Top-right — Product -->
    <div class="node product" style="left: 86%; top: 290px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.6V17h8v-2.4A7 7 0 0 0 12 2z"/></svg>
      <div class="label">PRODUCT</div>
    </div>
    <!-- Right-bottom (front) — Security -->
    <div class="node security" style="left: 78%; top: 460px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <div class="label">SECURITY</div>
    </div>
    <!-- Bottom-left (front) — Engineering -->
    <div class="node engineering" style="left: 22%; top: 460px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
      <div class="label">ENGINEERING</div>
    </div>
    <!-- Left — Architecture -->
    <div class="node architecture" style="left: 14%; top: 290px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="5" rx="1"/><rect x="3" y="17" width="6" height="5" rx="1"/><rect x="15" y="17" width="6" height="5" rx="1"/><path d="M12 7v3M12 10H6v7M12 10h6v7"/></svg>
      <div class="label">ARCHITECTURE</div>
    </div>
  </div>

  <div class="tag"><b>CAPSTONE</b> · FIVE PILLARS · ONE FABRIC</div>
</div>
</body>
</html>
