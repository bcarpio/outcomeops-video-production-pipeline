<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OutcomeOps + OpenAI on Bedrock -- Pick the Model. Keep the Substrate.</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body, #root { margin: 0; height: 100%; background: #050812; color: #E6EBF5; overflow: hidden;
                      font-family: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes ooPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes ooBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes ooSpin  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes ooCaret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scene_ui.jsx"></script>
<script type="text/babel" src="scene.jsx"></script>

<script type="text/babel" data-presets="react">
  const isExport = new URLSearchParams(location.search).get('export') === '1';

  function App() {
    return (
      <Stage
        width={1600}
        height={900}
        duration={DUR}
        background="#0A1020"
        persistKey={isExport ? "openai-bedrock-power-export" : "openai-bedrock-power"}
        hideBar={isExport}
        loop={!isExport}
      >
        <OutcomeOpsVideo />
        <AudioTrack src="narration.mp3?v=2" />
      </Stage>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
