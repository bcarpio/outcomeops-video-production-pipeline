<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OutcomeOps — CTA</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body, #root { margin: 0; height: 100%; background: #0A1020; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #E6EBF5; overflow: hidden; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  // ?variant=analytics|cve|jira — picks tagline + voice-over for this CTA
  const params = new URLSearchParams(location.search);
  const variants = ['analytics', 'cve', 'jira'];
  const picked = params.get('variant');
  window.__CTA_VARIANT__ = variants.includes(picked) ? picked : 'analytics';
  window.__IS_EXPORT__   = params.get('export') === '1';
</script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scene.jsx"></script>

<script type="text/babel" data-presets="react">
  function App() {
    return (
      <Stage
        width={1600}
        height={900}
        duration={CTA_DUR}
        background="#0A1020"
        persistKey={window.__IS_EXPORT__ ? `ooo-cta-${window.__CTA_VARIANT__}-export` : `ooo-cta-${window.__CTA_VARIANT__}`}
        hideBar={window.__IS_EXPORT__}
        loop={true}
      >
        <CTAScene/>
      </Stage>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
