<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Context Engineering vs Prompt Engineering — OutcomeOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050910; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #f4f6fb; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../marketing/animations.jsx"></script>
<script type="text/babel" src="../marketing/scenes-shared.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>

<script>
  const params = new URLSearchParams(location.search);
  const isExport = params.get('export') === '1';
  window.__OO_EXPORT = isExport;
</script>

<script type="text/babel">
  function App() {
    const isExport = window.__OO_EXPORT;
    const cacheBust = Date.now();
    const audioSrc = `narration.mp3?v=${cacheBust}`;

    return (
      <Stage
        width={1920} height={1080} duration={60}
        background={OO_COLORS.bg}
        persistKey={isExport ? 'oo-cevpe-export' : 'oo-cevpe'}
        hideBar={isExport}
        loop={!isExport}
      >
        <ContextVsPromptCut/>
        <AudioTrack src={audioSrc}/>
      </Stage>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
