# 60-second walkthrough of outcomeops.ai/how-it-works.
# Six sections, each with mount/scroll-triggered animations. We pause on
# each long enough for the animation to play out before scrolling on.
#
# Section animation budgets (from reading HowItWorks.tsx):
#   Hero (90% PR approval stat)                ~4s
#   Assign & Forget (Jira ticket typing)        ~6s
#   PR Review (commits + 6 checks reveal)       ~8s
#   PR Commands (failed check + fix typing)     ~8s
#   Knowledge Base (query → response → sources) ~6s
#   Sprint Board (6 stories Kanban flow)        ~9s

name: outcomeops-ai-how-it-works
url: https://www.outcomeops.ai/how-it-works

viewport:
  width: 1920
  height: 1080

target_seconds: 60

narration_prompt: |
  60-second walkthrough of HOW OutcomeOps actually works, paced to a
  six-section product page. Audience: Fortune 500 engineering leader who
  has heard the pitch and wants to see the workflow.

  The page is on screen and scrolling through six sections in this exact
  order — the narration must follow it beat-by-beat:

  1. Hero / Assign and forget — A Jira ticket is assigned to OutcomeOps
     the same way you'd assign it to an engineer. 90% first-time PR
     approval rate.
  2. PR Review — OutcomeOps writes the code, organizes it into atomic
     commits, then runs AI-powered checks against the team's own ADRs
     and standards. Cost is shown per PR (here, $1.98).
  3. PR Commands — When a check fails, you fix it like any PR: comment
     `outcomeops: fix license` and it pushes the fix.
  4. Knowledge Base — The same code-maps that power generation become a
     queryable knowledge base. Engineers ask in plain English, get
     answers grounded in the real architecture.
  5. Sprint Board — While the team designs outcomes, OutcomeOps
     translates them into shipped code. 10-15x velocity on standard
     implementation work.

  Close with one punchy line about engineers focusing on outcomes
  instead of typing. Avoid filler. Match the rhythm of the page.

voice: Matthew

# Waits sized to the actual narration paragraphs, not the section animation
# lengths. Audio is 53.66s; mapping per section:
#   0-3s   Hero: opens with "You assign the ticket..."
#   3-9s   Section 2 (Assign & Forget): finishes the assignment beat
#   9-23s  Section 3 (PR Review): "atomic commits, ADRs, $1.98" — 14s beat
#   23-32s Section 4 (PR Commands): "outcomeops: fix license"
#   32-43s Section 5 (Knowledge Base): query → grounded answer
#   43-53s Section 6 (Sprint Board) + close: "10-15x... systems not typing"
interactions:
  - { wait: 3 }
  - { scroll: 900 }
  - { wait: 6 }
  - { scroll: 900 }
  - { wait: 14 }
  - { scroll: 900 }
  - { wait: 9 }
  - { scroll: 900 }
  - { wait: 11 }
  - { scroll: 900 }
  - { wait: 10 }
