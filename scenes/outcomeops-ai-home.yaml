# 30-second walkthrough of the outcomeops.ai marketing homepage.
# Hero stats → pain points → enterprise features → CTA.

name: outcomeops-ai-home
url: https://outcomeops.ai

viewport:
  width: 1920
  height: 1080

target_seconds: 30

narration_prompt: |
  30-second marketing video introducing OutcomeOps to a Fortune 500
  engineering leader who has heard of context engineering but doesn't
  know what we do.

  Open with the headline outcome: AI tools generate generic code, we
  generate code that already matches your standards. Mention the proof
  numbers from real deployments — 16-hour tasks finishing in 15 minutes,
  $2-$4 per feature, 100-200x ROI. Land the close on private deployment
  in their AWS account, no data leaves the tenant. Last line should be
  punchy enough to make the viewer go look at the site.

# Polly Neural voice.
voice: Matthew

# Smooth scroll through the homepage while the narration plays. The
# stats are roughly the first viewport, then "your AI coding crisis"
# pain points, then the Enterprise Platform grid, then a CTA section.
interactions:
  - { wait: 3 }
  - { scroll: 600 }
  - { wait: 5 }
  - { scroll: 700 }
  - { wait: 5 }
  - { scroll: 700 }
  - { wait: 5 }
  - { scroll: 700 }
  - { wait: 4 }
